
name: QR Website Scheduler

on:
  schedule:
    - cron: '*/15 0-13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
     
      - name: Visit websites
        run: |
          urls=(
            "https://www.costco.com.tw/Televisions-Appliances/Large-Appliances/c/301"
            "https://www.google.com"
            "https://www.google.com"
          )

          for url in "${urls[@]}"; do
            echo "Checking: $url"
            curl -L --fail --max-time 30 \
              -sS -o /dev/null \
              -w "HTTP Status: %{http_code}\n" \
              "$url"
          done
