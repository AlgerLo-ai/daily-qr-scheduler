name: QR Website Scheduler

on:
  schedule:
    - cron: '*/15 0-13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest

        steps:
      - name: Check websites
        shell: bash
        run: |
          urls=(
            "https://www.costco.com.tw/Televisions-Appliances/Large-Appliances/c/301"
            "https://www.google.com"
            "https://www.google.com"
          )

          failed=0

          for url in "${urls[@]}"; do
            echo "Checking: $url"

            if status=$(curl -L -sS \
              --max-time 30 \
              -o /dev/null \
              -w "%{http_code}" \
              "$url"); then
              echo "HTTP Status: $status"
            else
              echo "FAILED: $url (HTTP: ${status:-No response})"
              failed=1
            fi
          done

          exit "$failed"
