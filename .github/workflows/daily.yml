name: QR Website Scheduler

on:
  schedule:
    - cron: '*/15 0-13 * * *'
  workflow_dispatch:

jobs:
  visit:
    # Pause automatic scheduled checks while preserving manual checks.
    if: ${{ github.event_name != 'schedule' || vars.MONITOR_PAUSED != 'true' }}
    runs-on: ubuntu-latest
    env:
      # Written by the Apps Script control page as a JSON array.
      MONITOR_URLS_JSON: ${{ vars.MONITOR_URLS }}
    steps:
      - name: Check websites
        shell: bash
        run: |
          set -uo pipefail

          # Use the existing sites until the control page saves MONITOR_URLS.
          if ! urls_text="$(python3 - <<'PY'
          import ipaddress
          import json
          import os
          import re
          import sys
          from urllib.parse import urlsplit, urlunsplit

          defaults = [
              "https://www.google.com"
          ]
          raw = os.environ.get("MONITOR_URLS_JSON", "").strip()

          try:
              urls = json.loads(raw) if raw else defaults
              if not isinstance(urls, list) or not urls:
                  raise ValueError("URL list must be a non-empty JSON array")
              if len(urls) > 10:
                  raise ValueError("At most 10 URLs are allowed")

              unique = []
              seen = set()
              for item in urls:
                  if not isinstance(item, str):
                      raise ValueError("Each URL must be text")
                  value = item.strip()
                  if not value or len(value) > 2048 or "\n" in value or "\r" in value:
                      raise ValueError("A URL is empty, too long, or malformed")

                  parts = urlsplit(value)
                  scheme = parts.scheme.lower()
                  host = (parts.hostname or "").lower().rstrip(".")
                  if scheme not in ("http", "https") or not host:
                      raise ValueError("Only complete http:// or https:// URLs are allowed")
                  if parts.username or parts.password:
                      raise ValueError("URLs must not contain usernames or passwords")
                  if host == "localhost" or host.endswith((".local", ".internal", ".test", ".example")):
                      raise ValueError("Local or private host names are not allowed")
                  try:
                      ipaddress.ip_address(host)
                      raise ValueError("IP-address URLs are not allowed")
                  except ValueError as exc:
                      if str(exc) == "IP-address URLs are not allowed":
                          raise
                  labels = host.split(".")
                  if len(labels) < 2 or any(
                      not re.fullmatch(r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", label)
                      for label in labels
                  ):
                      raise ValueError("A public domain name is required")
                  try:
                      port = parts.port
                  except ValueError:
                      raise ValueError("The URL port is invalid")
                  if port not in (None, 80, 443):
                      raise ValueError("Only standard web ports are allowed")

                  netloc = host
                  if port and not ((scheme == "http" and port == 80) or (scheme == "https" and port == 443)):
                      netloc += ":" + str(port)
                  normalized = urlunsplit((scheme, netloc, parts.path or "/", parts.query, ""))
                  if normalized not in seen:
                      seen.add(normalized)
                      unique.append(normalized)

              if not unique:
                  raise ValueError("At least one unique URL is required")
              print("\n".join(unique))
          except Exception as exc:
              print("Invalid MONITOR_URLS configuration: " + str(exc), file=sys.stderr)
              sys.exit(1)
          PY
          )"; then
            echo "::error::Unable to load the website list. Check MONITOR_URLS in repository Actions variables."
            exit 1
          fi

          mapfile -t urls <<< "$urls_text"
          failed=0

          for url in "${urls[@]}"; do
            # Keep query strings out of the Actions log.
            display_url="${url%%\?*}"
            echo "Checking: $display_url"

            if status=$(curl -L -sS \
              --max-time 30 \
              -o /dev/null \
              -w "%{http_code}" \
              "$url"); then
              echo "HTTP Status: $status"
            else
              echo "FAILED: $display_url (HTTP: ${status:-No response})"
              failed=1
            fi
          done

          exit "$failed"
