name: QR Website Scheduler

on:
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    env:
      # Apps Script stores the URL list here as a JSON array.
      MONITOR_URLS_JSON: ${{ vars.MONITOR_URLS }}
    steps:
      - name: Check websites
        shell: bash
        run: |
          set -euo pipefail

          urls_text="$(python3 - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("MONITOR_URLS_JSON", "").strip()
          try:
              urls = json.loads(raw) if raw else []
              if not isinstance(urls, list) or len(urls) > 10:
                  raise ValueError("Use up to 10 website URLs")

              unique = []
              seen = set()
              for url in urls:
                  if not isinstance(url, str):
                      raise ValueError("Each URL must be text")
                  url = url.strip()
                  if not url.startswith(("https://", "http://")) or "\n" in url or "\r" in url:
                      raise ValueError("Each URL must start with http:// or https://")
                  if url not in seen:
                      seen.add(url)
                      unique.append(url)

              print("\n".join(unique))
          except (json.JSONDecodeError, ValueError) as error:
              print("Invalid MONITOR_URLS: " + str(error), file=sys.stderr)
              sys.exit(1)
          PY
          )"

          if [[ -z "$urls_text" ]]; then
            echo "No monitoring websites configured; skipping checks."
            exit 0
          fi

          mapfile -t urls <<< "$urls_text"
          failed=0

          for url in "${urls[@]}"; do
            # Keep query strings out of the Actions log.
            display_url="${url%%\?*}"
            echo "Checking: $display_url"

            if status=$(curl -f -L -sS \
              --max-time 30 \
              -A "Mozilla/5.0 (compatible; QRWebsiteMonitor/1.0)" \
              -o /dev/null \
              -w "%{http_code}" \
              "$url"); then
              echo "HTTP Status: $status"
            else
              echo "FAILED: $display_url (HTTP: ${status:-No response})"
              failed=1
            fi
          done

          exit "$failed"
