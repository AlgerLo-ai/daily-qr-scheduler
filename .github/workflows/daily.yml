
name: QR Website Scheduler

on:
  schedule:
    - cron: '*/15 0-13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - name: Visit website
        run: |
          curl -L --max-time 30 \
            -A "QR-Website-Monitor" \
            -o /dev/null \
            -sS \
            -w "HTTP Status: %{http_code}\n" \
            "https://www.costco.com.tw/Televisions-Appliances/Large-Appliances/c/301"
